name: Бэкап базы (Supabase kv)

# Раз в сутки выгружает всю таблицу kv из Supabase и складывает
# сжатый снапшот в отдельную ветку `backups` (main не трогается, сайт не пересобирается).
# Можно запустить вручную: вкладка Actions → этот workflow → Run workflow.

on:
  schedule:
    - cron: '17 3 * * *'   # ежедневно ~03:17 UTC
  workflow_dispatch:

concurrency:
  group: backup-kv
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Дамп таблицы kv и коммит в ветку backups
        env:
          # Публичный anon-ключ (только чтение; запись закрыта RLS) — тот же, что в index.html
          SUPA_URL: https://cloud.komikdnd.ru
          SUPA_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzg5MDg1MzA1LCJleHAiOjIxMDQ0NDUzMDV9.7evXWwQ2bbrEVPTpfMEnrFv8ON5dFC_iU-v7MiVQPyc
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          SNAP="/tmp/kv-$DATE.json.gz"

          echo "Выгружаю таблицу kv…"
          curl -sS --fail --max-time 180 \
            "$SUPA_URL/rest/v1/kv?select=*" \
            -H "apikey: $SUPA_KEY" -H "Authorization: Bearer $SUPA_KEY" \
            | gzip -9 > "$SNAP"
          echo "Снапшот: $(du -h "$SNAP" | cut -f1)"
          # пустой ответ или ошибка вместо таблицы (облако лежит, ключ сменился) — не коммитим:
          # иначе ротация вытеснила бы настоящие копии пустыми
          gzip -dc "$SNAP" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d,list) and len(d)>0, "пустой снапшот"; print("строк:", len(d))'

          # Ветка backups хранит ТОЛЬКО последний месяц. Раньше старые файлы удалялись из дерева, но каждый
          # ежедневный коммит навсегда оставался в истории (~2,5 МБ в день в публичном репозитории).
          # Теперь ветка каждый раз собирается заново одним коммитом: снапшоты за последние 31 день + README,
          # и перезаписывается (force push) — всё, что старше, уходит из истории целиком.
          KEEP=$(mktemp -d); mkdir -p "$KEEP/backups"
          if git fetch -q --depth=1 origin backups 2>/dev/null; then
            git archive FETCH_HEAD backups | tar -x -C "$KEEP" || true
          fi
          cp "$SNAP" "$KEEP/backups/"
          CUT=$(date -u -d '30 days ago' +%Y-%m-%d)   # сегодня + 30 предыдущих дней
          for f in "$KEEP"/backups/kv-*.json.gz; do
            d=$(basename "$f" .json.gz); d=${d#kv-}
            if [[ "$d" < "$CUT" ]]; then echo "Удаляю старый: $(basename "$f")"; rm -f "$f"; fi
          done
          N=$(ls -1 "$KEEP"/backups/kv-*.json.gz | wc -l)

          git config user.name  "komik-backup-bot"
          git config user.email "backup@users.noreply.github.com"
          git checkout -q --orphan backups-fresh
          git rm -rf -q --cached . 2>/dev/null || true
          git clean -fdxq
          cp -r "$KEEP/backups" .
          printf '# Резервные копии базы KOMIK\n\nАвтоснапшоты таблицы Supabase `kv` (gzip), по одному в день.\nХранится только последний месяц (31 день): ветка каждый день пересобирается одним коммитом,\nболее старые копии удаляются вместе с историей.\n\nСейчас копий: %s, самая старая — %s.\n' "$N" "$(ls -1 backups/kv-*.json.gz | head -1 | xargs basename)" > README.md
          git add backups README.md
          git commit -q -m "Бэкап kv $DATE (копий: $N, с $CUT)"
          git push -q --force origin HEAD:backups
          echo "Готово: backups/kv-$DATE.json.gz, всего копий $N"
