<!doctype html>
<html lang="ru" data-project="classic"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0c110d">
<title>КОМИК — прототип приложения</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   КОМИК · оболочка приложения — прототип
   Визуальный язык сайта сохранён без изменений: те же палитры сеттингов,
   матовое стекло, волосяные границы, пружинная кривая.
   Новое здесь только одно — навигация: шторка вместо нижней панели.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#0c110d; --surface:#171f17; --surface2:#212b20; --txt:#efe8d6;
  --dim:#c9c3b2; --muted:#8f9585; --red:#d3a84a; --red-soft:rgba(211,168,74,.14);
  --line:rgba(239,232,214,.10); --line2:rgba(239,232,214,.18);
  --r-sm:12px; --r-md:16px; --r-lg:20px; --r-sheet:28px;
  --spring:cubic-bezier(.32,.72,0,1);
  --f-disp:'Chakra Petch',system-ui,-apple-system,sans-serif;
  --f-body:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:ui-monospace,'Share Tech Mono',Consolas,monospace;
  --drawer:min(84vw,330px);
  --top:calc(56px + env(safe-area-inset-top,0px));
}
[data-project="assimilation"]{--bg:#0b0c10;--surface:#14161c;--surface2:#1c1f27;--txt:#eceef5;--dim:#c3c7d4;--muted:#868b9c;--red:#ff4757;--red-soft:rgba(255,71,87,.14);--line:rgba(236,238,245,.10);--line2:rgba(236,238,245,.18)}
[data-project="legacy"]{--bg:#0b0a12;--surface:#161426;--surface2:#1e1b30;--txt:#ece9f5;--dim:#c6c1da;--muted:#8b86a3;--red:#a78bfa;--red-soft:rgba(167,139,250,.15);--line:rgba(236,233,245,.10);--line2:rgba(236,233,245,.18)}
[data-project="neverland"]{--bg:#100c08;--surface:#1c1610;--surface2:#261e15;--txt:#f5ecdc;--dim:#d8cbb4;--muted:#9c8e75;--red:#ffd970;--red-soft:rgba(255,217,112,.14);--line:rgba(245,236,220,.10);--line2:rgba(245,236,220,.18)}
[data-project="terra"]{--bg:#0d0d0c;--surface:#191917;--surface2:#232320;--txt:#f0ece0;--dim:#d2ccbb;--muted:#94907f;--red:#e8dcbf;--red-soft:rgba(232,220,191,.13);--line:rgba(240,236,224,.10);--line2:rgba(240,236,224,.18)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--f-body);font-size:15.5px;
  line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}

/* ── каркас: шторка лежит ПОД полотном, полотно съезжает вправо ── */
#shell{position:fixed;inset:0;overflow:hidden}
#drawer{position:absolute;top:0;left:0;bottom:0;width:var(--drawer);
  display:flex;flex-direction:column;background:var(--bg);
  padding:calc(14px + env(safe-area-inset-top,0px)) 0 calc(10px + env(safe-area-inset-bottom,0px));
  will-change:transform;z-index:1}
#pane{position:absolute;inset:0;background:var(--bg);z-index:2;
  display:flex;flex-direction:column;will-change:transform;
  box-shadow:-16px 0 44px rgba(0,0,0,.55)}
#scrim{position:absolute;inset:0;z-index:3;background:rgba(0,0,0,.34);
  opacity:0;pointer-events:none;will-change:opacity}
.anim #pane,.anim #drawer,.anim #scrim{transition:transform .42s var(--spring),opacity .42s var(--spring),border-radius .42s var(--spring)}
@media (prefers-reduced-motion:reduce){.anim #pane,.anim #drawer,.anim #scrim{transition-duration:.01ms}}

/* ── верхняя панель ── */
#top{height:var(--top);padding:env(safe-area-inset-top,0px) 6px 0;flex:none;
  display:flex;align-items:center;gap:4px;border-bottom:.5px solid var(--line);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(22px);position:relative;z-index:2}
.icon{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;flex:none}
.icon:active{background:var(--surface2)}
.icon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#worldBtn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;
  justify-content:center;padding:0 4px}
#worldBtn .w{font-family:var(--f-disp);font-weight:700;font-size:.98rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#worldBtn .v{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}

/* ── содержимое ── */
#views{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:14px 14px calc(26px + env(safe-area-inset-bottom,0px))}
.view{display:none;flex-direction:column;gap:14px}
.view.on{display:flex}
h2.vh{margin:0;font-family:var(--f-disp);font-size:1.28rem;font-weight:700;letter-spacing:.01em}
.hint{color:var(--muted);font-size:.86rem}

/* ── шторка: содержимое ── */
.dr-prof{display:flex;align-items:center;gap:11px;padding:8px 16px 14px}
.ava{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:var(--red);color:var(--bg);font-weight:700;font-size:1.05rem;font-family:var(--f-disp)}
.dr-prof .nm{font-weight:600;font-size:.98rem;line-height:1.2}
.dr-prof .tg{font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.dr-search{margin:0 12px 12px;display:flex;align-items:center;gap:9px;background:var(--surface);
  border:.5px solid var(--line);border-radius:13px;padding:9px 12px}
.dr-search input{flex:1;min-width:0;background:none;border:0;color:var(--txt);font:inherit;font-size:.9rem;outline:none}
.dr-search svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2}
.dr-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 12px}
.dr-lbl{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);padding:14px 8px 7px}
.dr-item{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:13px;
  text-align:left;font-size:.95rem;transition:background .16s}
.dr-item:active{background:var(--surface)}
.dr-item.on{background:var(--surface);color:var(--red);font-weight:600}
.dr-item svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 18%,transparent)}
.dr-item .cnt{margin-left:auto;font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.dr-foot{padding:10px 12px 0;border-top:.5px solid var(--line);margin:8px 12px 0}

/* ── карточки списка ── */
.cards{display:flex;flex-direction:column;gap:9px}
.cd{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:.5px solid var(--line);
  border-radius:var(--r-md);padding:12px 13px;text-align:left;width:100%;transition:transform .13s var(--spring)}
.cd:active{transform:scale(.985)}
.cd .ic{width:38px;height:38px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;
  flex:none;font-size:1.05rem}
.cd .tt{font-weight:600;font-size:.97rem;line-height:1.25}
.cd .kk{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.cd .bb{color:var(--muted);font-size:.84rem;line-height:1.4;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
.cat{background:var(--surface);border:.5px solid var(--line);border-radius:var(--r-md);
  padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .13s var(--spring)}
.cat:active{transform:scale(.97)}
.cat .n{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.cat .e{font-size:1.5rem}

/* ── нижний лист (карточка существа/заклинания) ── */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;height:92dvh;background:var(--surface);
  border-radius:var(--r-sheet) var(--r-sheet) 0 0;border-top:.5px solid var(--line2);
  transform:translateY(100%);display:flex;flex-direction:column;will-change:transform;
  box-shadow:0 -14px 44px rgba(0,0,0,.5)}
#sheetScrim{position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.5);opacity:0;pointer-events:none}
.anim #sheet,.anim #sheetScrim{transition:transform .42s var(--spring),opacity .42s var(--spring)}
.sh-grab{padding:10px 0 4px;display:grid;place-items:center;flex:none;touch-action:none;cursor:grab}
.sh-grab i{width:38px;height:4px;border-radius:2px;background:var(--line2);display:block}
.sh-head{padding:4px 18px 12px;display:flex;flex-direction:column;gap:5px;flex:none;border-bottom:.5px solid var(--line)}
.sh-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:14px 18px calc(24px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:13px}
.dos{display:flex;flex-direction:column;gap:6px}
.dos .r{display:flex;gap:10px;font-size:.88rem}
.dos .r .k{flex:0 0 122px;font-family:var(--f-mono);font-size:.6rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);padding-top:3px}
.dos .r .v{flex:1;color:var(--dim)}
.sec{background:var(--surface2);border:.5px solid var(--line);border-radius:var(--r-sm);padding:11px 13px}
.sec h4{margin:0 0 5px;font-size:.92rem;font-weight:600}
.sec p{margin:0;color:var(--dim);font-size:.87rem;white-space:pre-wrap}
.tbl{overflow-x:auto;border:.5px solid var(--line);border-radius:var(--r-sm)}
table{border-collapse:collapse;width:100%;font-family:var(--f-mono);font-size:.72rem;min-width:340px}
th,td{padding:6px 8px;text-align:left;border-bottom:.5px solid var(--line);white-space:nowrap}
th{font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding-top:4px}
.tag{font-family:var(--f-mono);font-size:.62rem;padding:3px 8px;border-radius:5px;border:.5px solid var(--line);color:var(--muted)}
.tag.canon{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}

.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:52px 20px;color:var(--muted)}
.empty svg{width:74px;height:74px;stroke:var(--red);fill:none;stroke-width:1.2;opacity:.75}
.empty .t{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase}
.fab{position:absolute;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:54px;height:54px;
  border-radius:18px;background:var(--red);color:var(--bg);display:grid;place-items:center;z-index:5;
  box-shadow:0 7px 20px rgba(0,0,0,.42)}
.fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2}
.edge{position:absolute;top:var(--top);left:0;bottom:0;width:26px;z-index:4;touch-action:pan-y}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:.5px solid var(--line);
  border-radius:999px;padding:5px 12px;font-size:.84rem}
.row2{display:flex;gap:9px;flex-wrap:wrap}
</style></head><body>

</div>

<div id="sheetScrim"></div>

  <div class="sh-body" id="shBody"></div>
</section>

const DATA = [{"cat":"world","sub":"bestiary","ico":"goblin","kicker":"Бестиарий · Опасность 1/4","title":"Гоблин","body":"Мелкие злобные твари, живущие стаями в пещерах. Трусливы поодиночке, опасны толпой.","id":"srd-goblin","status":"official","srcbook":"MM","src":"Бестиарий (MM) · перенос с ttg.club · адаптация КОМИК","dossier":[{"k":"КД","v":"15 (кожаный доспех, щит)"},{"k":"Хиты","v":"7 (2d6)"},{"k":"Скорость","v":"30 футов"},{"k":"Характеристики","v":"СИЛ 8 (−1), ЛОВ 14 (+2), ТЕЛ 10 (+0), ИНТ 10 (+0), МДР 8 (−1), ХАР 8 (−1)"},{"k":"Навыки","v":"Скрытность +6"},{"k":"Чувства","v":"тёмное зрение 60 фт., пассивная Внимательность 9"},{"k":"Языки","v":"Гоблинский, Общий"},{"k":"Мировоззрение","v":"Нейтрально-злой"},{"k":"Опасность","v":"1/4"},{"k":"Среда обитания","v":"лес, равнина/луг, холмы, подземье"}],"sections":[{"h":"Ловкий побег","t":"Гоблин может в каждом своём ходу бонусным действием совершать действие Засада или Отход."},{"h":"Действие · Скимитар","t":"Рукопашная атака оружием: +4 к попаданию, досягаемость 5 фт., одна цель. Попадание: 5 (1к6+2) рубящего урона."},{"h":"Действие · Короткий лук","t":"Дальнобойная атака оружием: +4 к попаданию, дистанция 80/320 фт., Попадание: 5 (1к6+2) колющего урона."},{"h":"Описание","t":"Гоблины — это злобные создания, часто собирающиеся в огромные полчища, где каждый из них жаждет власти, которой они так любят злоупотреблять."}]},{"cat":"world","sub":"bestiary","ico":"goblin","kicker":"Бестиарий · Опасность 1","title":"Багбир","body":"Волосатые громилы-убийцы. Крадутся тихо, бьют страшно.","id":"srd-bagbir","status":"official","srcbook":"MM","src":"SRD 5.1 (CC-BY-4.0) · адаптация КОМИК","dossier":[{"k":"КД","v":"16 (шкурный доспех, щит)"},{"k":"Хиты","v":"27 (5d8+5)"},{"k":"Скорость","v":"30 футов"},{"k":"Характеристики","v":"СИЛ 15 (+2), ЛОВ 14 (+2), ТЕЛ 13 (+1), ИНТ 8 (−1), МДР 11 (+0), ХАР 9 (−1)"},{"k":"Навыки","v":"Скрытность +6, Выживание +2"},{"k":"Чувства","v":"тёмное зрение 60 фт., пассивная Внимательность 10"}, ракон может использовать Ужасающую внешность. Затем он совершает три атаки: одну Укусом и две Когтями."},{"h":"Действие · Укус","t":"Рукопашная атака оружием: +14 к попаданию, досягаемость 10 фт., одна цель. Попадание: 19 (2к10+8) колющего урона плюс 7 (2к6) урона огнём."},{"h":"Действие · Коготь","t":"Рукопашная атака оружием: +14 к попаданию, досягаемость 5 фт., одна цель. Попадание: 15 (2к6+8) рубящего урона."},{"h":"Действие · Хвост","t":"Рукопашная атака оружием: +14 к попаданию, досягаемость 15 фт., одна цель. Попадание: 17 (2к8+8) дробящего урона."},{"h":"Действие · Ужасающая внешность","t":"Все существа на выбор дракона, находящиеся в пределах 120 футов от него и знающие о его присутствии, должны преуспеть в спасброске Мудрости со Сл 19, иначе станут испуганными на 1 минуту.\n\nСущество может повторять этот спасбросок в конце каждого своего хода, оканчивая эффект на себе при успехе. Если спасбросок существа был успешным, или эффект на нём окончился, оно получает иммунитет к Ужасающей внешности этого дракона на следующие 24 часа."},{"h":"Действие · Огненное дыхание (перезарядка 5–6)","t":"Дракон выдыхает огонь 60-футовым конусом. Все существа в этой области должны совершить спасбросок Ловкости со Сл 21, получая 63 (18к6) урона огнём при провале, или половину этого урона при успехе."}]},{"cat":"world","sub":"bestiary","ico":"beast","kicker":"Большой монстр · без мировоззрения","title":"Совомед","body":"Крик совомеда эхом разносится по тёмным рощам и укрытым ночью лесам, разрывая тишину и предвещая смерть жертвам этого зверя.","id":"b-owlbear","status":"official","srcbook":"MM","src":"Бестиарий (MM) · перенос с ttg.club · адаптация КОМИК","dossier":[{"k":"КД","v":"13 (природный доспех)"},{"k":"Хиты","v":"59 (7d10)"},{"k":"Скорость","v":"40 фт."},{"k":"Характеристики","v":"СИЛ 20 (+5), ЛОВ 12 (+1), ТЕЛ 17 (+3), ИНТ 3 (−4), МДР 12 (+1), ХАР 7 (−2)"},{"k":"Навыки","v":"Внимательность +3"},{"k":"Чувства","v":"тёмное зрение 60 фт., пассивная Внимательность 13"},{"k":"Языки","v":"—"},{"k":"Мировоззрение","v":"Без мировоззрения"},{"k":"Опасность","v":"3 (700 опыта) · БМ +2"},{"k":"Среда обитания","v":"лес"}],"sections":[{"h":"Острое зрение и тонкий нюх","t":"Совомед совершает с преимуществом проверки Мудрости (Внимательность), полагающиеся на зрение или обоняние."},{"h":"Действие · Мультиатака","t":"Совомед совершает две атаки: одну Клювом и одну Когтями."},{"h":"Действие · Клюв","t":"Рукопашная атака оружием: +7 к попаданию, досягаемость 5 фт., одно существо. Попадание: 10 (1к10+5) колющего урона."},{"h":"Действие · Когти","t":"Рукопашная атака оружием: +7 к попаданию, досягаемость 5 фт., одна цель. Попадание: 14 (2к8+5) рубящего урона."},{"h":"Описание","t":"Перья покрывают крепкую, косматую шкуру его медвежьего тела, а огромные, как блюдца, круглые зрачки гневно сверкают на совиной голове.\n\nСмертоносная свирепость. Репутация совомедов, как свирепых, агрессивных, упрямых существ с абсолютно дурным нравом, делает их хищниками, которых боятся более всего в диких местах. Существует очень мало вещей, которых испугался бы голодный совомед. Даже чудовища, превосходящие совомедов по силе и размеру, избегают связываться с ними, так как эти существа не обращают внимания на превосходство противника и атакуют без предупреждения.\n\nСовершенные хищники. Совомед"}]},{"cat":"character","sub":"classes","ico":"class","kicker":"Класс","title":"Изобретатель","body":"Мастер-изобретатель черпает магию из инструментов и хитрых устройств. Он вливает чары в предметы, собирает волшебные приспособления и превращает изобретательность в оружие.","id":"tce-artificer","status":"official","srcbook":"TCE","src":"Tasha's Cauldron of Everything (TCE) · адаптация КОМИК","dossier":[{"k":"Кость Хитов","v":"d8"},{"k":"Главная характеристика","v":"Интеллект"},{"k":"Спасброски","v":"Телосложение, Интеллект"},{"k":"Владение","v":"Лёгкие и средние доспехи, щиты, простое оружие; воровские инструменты, инструменты жестянщика, один набор инструментов ремесленника на выбор"},{"k":"Навыки","v":"2 на выбор: Магия, История, Анализ, Медицина, Природа, Внимательность, Ловкость рук"}],"sections":[{"h":"Использование заклинаний · 1 ур.","t":"Изучив тайное действие магии через призму изобретений, вы обрели способность применять заклинания. Для вас магия — ещё один инструмент и новый способ решать сложные задачи.\n\nЗаговоры. Вы знаете два заговора по своему выбору из списка заклинаний изобретателя. На 4 и 10 уровнях вы узнаёте дополнительный заговор.\n\nПодготовка заклинаний. Вы готовите список доступных вам заклинаний изобретателя. Для этого выберите некоторое число заклинаний из списка изобретателя, доступных уровней ячеек. Количество подготовленных заклинаний равно модификатору Интеллекта + половина уровня изобретателя (округление в"},{"h":"Магическое устройство · 1 ур.","t":"Вы научились наделять предметы толикой магии. При завершении короткого или продолжительного отдыха вы можете коснуться до трёх немагических предметов и придать каждому одно из следующих магических свойств по вашему выбору:\n• предмет издаёт запись, свет, запах или негромкий звук по вашему желанию;\n• предмет постоянно испускает свет свечи, факела или тусклый цвет;\n• на предмете появляется послание из ≤6 слов, которое можно менять;\n• предмет воспроизводит записанное вами сообщение (до 6 секунд).\n\nСвойства действуют неограниченно долго. Одновременно вы можете поддерживать число зачарованных так пр"},{"h":"Вливание в предмет · 2 ур.","t":"Вы освоили ряд формул-вливаний, которые превращают обычные вещи в магические предметы.\n\nФормулы. Вы знаете четыре формулы вливаний. На 6, 10, 14 и 18 уровнях вы узнаёте дополнительные формулы — всего до 12 на 20 уровне. При повышении уровня вы можете заменить одну известную формулу другой.\n\nВливание предмета. При завершении продолжительного отдыха вы можете коснуться немагического предмета и наделить его одним известным вливанием, превратив в магический. Число одновременно активных вливаний растёт с уровнем (2 на 2-м, 3 на 6-м, 4 на 10-м, 5 на 14-м, 6 на 18-м). Если вливание нужно настроить, о"},{"h":"Инструментальная гениальность · 3 ур.","t":"Вы всегда добавляете бонус мастерства к проверкам характеристик, сделанным с любым набором инструментов, которым вы владеете. Кроме того, вы можете использовать инструменты жестянщика для создания небольших устройств.\n\nВ дальнейшем ваши инструменты становятся продолжением ваших рук: с их помощью вы творите магию, ремонтируете предметы и обходите механические преграды."},{"h":"Специализация изобретателя · 3 ур.","t":"Вы выбираете специализацию, определяющую путь вашего мастерства: Алхимик, Артиллерист, Боевой кузнец или Оружейник. Специализация даёт умения на 3, 5, 9 и 15 уровнях."},{"h":"Увеличение характеристик · 4 ур.","t":"На 4, 8, 12, 16 и 19 уровнях вы можете увеличить одну характеристику на 2 или две характеристики на 1 (не выше 20), либо выбрать черту."},{"h":"Мастер инструментов · 6 ур.","t":"Ваше владение инструментами становится выдающимся. Для любой проверки, сделанной с набором инструментов, которым вы владеете, вы удваиваете свой бонус мастерства."}],"table":{"cols":["Ур","БМ","Умения","Заговоры","1","2","3","4","5"],"rows":[["1","+2","Использование заклинаний, Магическое устройство","2","2","—","—","—","—"],["2","+2","Вливание в предмет","2","2","—","—","—","—"],["3","+2","Инструментальная гениальность, Специализация изобретателя","2","3","—","—","—","—"],["4","+2","Увеличение характеристик","3","3","—","—","—","—"],["5","+3","—","3","4","2","—","—","—"],["6","+3","Мастер инструментов","3","4","2","—","—","—"],["7","+3","Мимолётное озарение","3","4","3","—","—","—"],["8","+3","Увеличение характеристик","3","4","3","—","—","—"]],"slots":5},"archs":[{"name":"Алхимик","desc":"Алхимик исследует магию через зелья и снадобья, обращая реагенты в целительные эликсиры и разрушительные составы."},{"name":"Артиллерист","desc":"Артиллерист превращает магию в разрушительную огневую мощь и создаёт волшебную пушку, разящую врагов."},{"name":"Боевой кузнец","desc":"Боевой кузнец соединяет магию и оружие, сражаясь бок о бок со своим стальным защитником."},{"name":"Оружейник","desc":"Оружейник вкладывает магию в доспех, превращая его в высокотехнологичную броню бойца или лазутчика."}]},{"cat":"character","sub":"classes","ico":"class","kicker":"Класс","title":"Колдун","body":"Сделка с покровителем. Мало ячеек — но все высшего доступного круга, и возвращаются они уже на коротком отдыхе.","id":"srd-koldun","status":"official","srcbook":"PHB","src":"SRD 5.1 (CC-BY-4.0) · адаптация КОМИК","dossier":[{"k":"Кость Хитов","v":"d8"},{"k":"Главная характеристика","v":"Харизма"},{"k":"Спасброски","v":"Мудрость, Харизма"},{"k":"Владение","v":"Лёгкие доспехи, простое оружие"},{"k":"Навыки","v":"2 на выбор: Анализ, Запугивание, История, Магия, Обман, Природа, Религия"}],"sections":[{"h":"Умение покровителя · 1 ур.","t":"На 1 уровне вы заключаете сделку с потусторонним существом на ваш выбор, подробности смотрите в конце описания класса. Ваш выбор определит умения, предоставляемые на 1, 6, 10 и 14 уровнях."},{"h":"Магия договора · 1 ур.","t":"Исследования тайн и магия, дарованная покровителем, дают вам возможность использовать заклинания.\n\nЗаговоры\n\nВы знаете два заговора на свой выбор из списка заклинаний колдуна. Вы узнаёте дополнительные заговоры колдуна на более высоких уровнях, как показано в колонке «известные заговоры».\n\nЯчейки заклинаний\n\nТаблица «Колдун» показывает, какое количество ячеек для сотворения заклинаний у вас есть, а также уровень этих ячеек — все ваши ячейки заклинаний одного уровня. Для сотворения одного из заклинаний колдуна 1 уровня и выше вы должны потратить ячейку заклинаний. Вы восстановите все потраченны"},{"h":"Таинственные воззвания · 2 ур.","t":"В процессе изучения оккультных знаний вы обнаружили таинственные воззвания: фрагменты запрещённых знаний, которые даруют магические способности.\n\nНа 2 уровне вы получаете два воззвания на свой выбор. Получая новые уровни колдуна, вы получаете дополнительные воззвания на свой выбор, как показано в колонке «известные воззвания».\n\nКроме того, когда вы получаете новый уровень этого класса, вы можете выбрать одно известное вам воззвание и заменить его другим, которое вы способны выучить на этом уровне."},{"h":"Воззвание · Аспект луны · XGE","t":"Требование: Договор гримуара\n\nВам больше не нужно спать и вас невозможно усыпить любым способом. Чтобы получить преимущества продолжительного отдыха, вы можете потратить все 8 часов на легкую деятельность, например, прочитать свою Книгу Теней и постоять на страже."},{"h":"Воззвание · Безжалостное проклятие · XGE","t":"Требование: 7 уровень и Заклинание: сглаз [hex] или способность колдуна к проклятию\n\nВаше проклятие создает временную связь между вами и вашей целью.\n\nБонусным действием вы можете магически телепортироваться на расстояние до 30 футов, в незанятое пространство, которое вы можете видеть в пределах 5 футов от цели, проклятой вашим заклинанием сглаз [hex] или вашим умением колдуна, таким как Проклятие Ведьмовского клинка или Знак дурного предзнаменования.\n\nЧтобы телепортироваться таким образом, вы должны иметь возможность видеть проклятую цель."},{"h":"Воззвание · Безумное проклятие · XGE","t":"Требование: 5 уровень и Заклинание: сглаз [hex] или способность колдуна к проклятию\n\nБонусным действием вы вызываете психическое возмущение вокруг цели, проклятого вашим заклинанием сглаз [hex] или вашим умением колдуна, таким как Проклятие Ведьмовского клинка или Знак дурного предзнаменования.\n\nКогда вы это делаете, вы наносите психический урон проклятой цели и каждому существу по вашему выбору, которое вы можете видеть в пределах 5 футов от цели. Психический урон равен вашему модификатору Харизмы (минимум 1 урон).\n\nЧтобы использовать этот воззвание, вы должны иметь возможность видеть проклят"},{"h":"Воззвание · Бессмертный раб · TCE","t":"Требование: 5 уровень\n\nВы можете использовать заклинание восставший труп [animate dead], без затраты ячейки заклинания.\n\nКак только вы это сделаете, вы не сможете сотворить его подобным образом снова, пока не закончите продолжительный отдых."}],"table":{"cols":["Ур","БМ","Умения","Заговоры","Известно","Воззвания","Ячеек","Круг"],"rows":[["1","+2","Потусторонний покровитель, Магия договора","2","2","—","1","1-й"],["2","+2","Таинственные воззвания","2","3","2","2","1-й"],["3","+2","Дар договора","2","4","2","2","2-й"],["4","+2","Увеличение характеристик","3","5","2","2","2-й"],["5","+3","—","3","6","3","2","3-й"],["6","+3","Умение покровителя","3","7","3","2","3-й"],["7","+3","—","3","8","3","2","4-й"],["8","+3","Увеличение характеристик","3","9","4","2","4-й"]],"slots":2},"archs":[{"name":"Архифея","desc":"Ваш покровитель это лорд или леди фей. Существо из легенд, хранящее секреты, забытые ещё до возникновения смертных рас. Мотивы, движущие такими сущностями, непостижимы, причудливы, и могут диктоваться"},{"name":"Исчадие","desc":"Вы заключили договор с исчадием из нижних планов бытия, сущностью, обладающей злыми устремлениями, даже если сами вы не разделяете их. Эти сущности жаждут осквернения и разрушения всего сущего, особен"},{"name":"Великий Древний","desc":"Ваш покровитель — таинственная сущность, природа которой совершенно чужда ткани реальности. Он может прийти из Дальнего Предела, пространства за пределами реальности, или это может быть один из древни"},{"name":"Ведьмовской Клинок (XGE)","desc":"Вы заключили свой договор с таинственной сущностью из Царства теней – силой, которая проявляется в разумном магическом оружии, сотворённом из тени."},{"name":"Небожитель (XGE)","desc":"Ваш покровитель – могущественное существо с Верхних Планов. Вы связаны с древним эмпиреем, соларом, ки-ринонм, единорогом или другим существом, которое находится в планах вечного блаженства."}]},{"cat":"spells","sub":"lvl0","ico":"magic","kicker":"Заговор · Воплощение","title":"Свет","body":"Предмет светится ярким светом на 20 футов и тусклым ещё на 20. Существо может увернуться спасброском Ловкости.","id":"srd-svet","status":"official","srcbook":"PHB","src":"Книга игрока (PHB) · перенос с ttg.club · адаптация КОМИК","dossier":[{"k":"Круг","v":"заговор"},{"k":"Школа","v":"Воплощение"},{"k":"Время накладывания","v":"Действие"},{"k":"Дистанция","v":"Касание"},{"k":"Компоненты","v":"В, М"},{"k":"Длительность","v":"1 час"},{"k":"Классы","v":"Бард, Волшебник, Жрец, Чародей, Изобретатель"}],"sections":[{"h":"Описание","t":"Вы касаетесь одного предмета, длина которого ни по одному из измерений не превышает 10 футов.\n\nПока заклинание активно, предмет испускает яркий свет в радиусе 20 футов и тусклый свет в пределах ещё 20 футов. Свет может быть любого выбранного вами цвета. Полное покрытие предмета чем-то непрозрачным блокирует свет.\n\nЗаклинание оканчивается, если вы наложите его ещё раз или окончите Действием. Если вы нацелились на предмет, несомый или носимый враждебным существом, это существо должно преуспеть в спасброске Ловкости, чтобы увернуться от заклинания."}]},{"cat":"spells","sub":"lvl1","ico":"magic","kicker":"1 круг · Воплощение","title":"Волшебная стрела","body":"Три стрелы по 1d4+1 силы, всегда попадают. На высоких кругах — по стреле за круг.","id":"srd-volshebnaya-strela","status":"official","srcbook":"PHB","src":"Книга игрока (PHB) · перенос с ttg.club · адаптация КОМИК","dossier":[{"k":"Круг","v":"1"},{"k":"Школа","v":"Воплощение"},{"k":"Время накладывания","v":"Действие"},{"k":"Дистанция","v":"120 футов"},{"k":"Компоненты","v":"В, С"},{"k":"Длительность","v":"Мгновенная"},{"k":"Классы","v":"Волшебник, Чародей"}],"sections":[{"h":"Описание","t":"Вы создаёте три светящихся дротика из магической силы. Каждый дротик попадает в существо на ваш выбор, видимое в пределах дистанции.\n\nДротик причиняет 1к4 + 1 урона силовым полем своей цели.\n\nВсе дротики атакуют одновременно, и вы можете направить их как в одно существо, так и в разных."},{"h":"На больших кругах","t":"Если вы накладываете это заклинание, используя ячейку 2 уровня или выше, заклинание создаёт по одному дополнительному дротику за каждый уровень ячейки выше первого."}]},{"cat":"spells","sub":"lvl3","ico":"magic","kicker":"3 круг · Воплощение","title":"Огненный шар","body":"Взрыв радиусом 20 футов: 8d6 огня, спасбросок Ловкости вдвое. +1d6 за круг.","id":"srd-ognennyy-shar","status":"official","srcbook":"PHB","src":"Книга игрока (PHB) · перенос с ttg.club · адаптация КОМИК","dossier":[{"k":"Круг","v":"3"},{"k":"Школа","v":"Воплощение"},{"k":"Время накладывания","v":"Действие"},{"k":"Дистанция","v":"150 футов"},{"k":"Компоненты","v":"В, С, М"},{"k":"Длительность","v":"Мгновенная"},{"k":"Классы","v":"Волшебник, Чародей"}],"sections":[{"h":"Описание","t":"Яркий луч вылетает из вашего указательного пальца в точку, выбранную вами в пределах дистанции, где и происходит взрыв пламени с гулким рёвом.\n\nВсе существа в пределах сферы с радиусом 20 футов с центром в этой точке должны совершить спасбросок Ловкости. Цель получает 8к6 урона огнём при провале или половину этого урона при успехе.\n\nЭтот огонь огибает углы. Он воспламеняет горючие предметы, которые никто не несёт и не носит."},{"h":"На больших кругах","t":"Если вы накладываете это заклинание, используя ячейку 4 уровня или выше, урон увеличивается на 1к6 за каждый уровень ячейки выше третьего."}]},{"cat":"character","sub":"races","ico":"race","kicker":"Раса","title":"Человек","body":"Универсальны и амбициозны. Самая распространённая раса — живут везде и берутся за всё.","id":"srd-chelovek","status":"official","srcbook":"PHB","src":"SRD 5.1 (CC-BY-4.0) · адаптация КОМИК","dossier":[{"k":"Характеристики","v":"+1 ко всем характеристикам"},{"k":"Размер и скорость","v":"Средний, 30 футов"},{"k":"Языки","v":"Общий + 1 язык"}],"sections":[]},{"cat":"character","sub":"races","ico":"race","kicker":"Раса","title":"Эльф","body":"Изящные долгожители. Тёмное зрение, преимущество против очарования, не спят — медитируют 4 часа.","id":"srd-elf","status":"official","srcbook":"PHB","src":"SRD 5.1 (CC-BY-4.0) · адаптация КОМИК","dossier":[{"k":"Характеристики","v":"+2 Ловкость"},{"k":"Размер и скорость","v":"Средний, 30 футов"},{"k":"Языки","v":"Общий, эльфийский"}],"sections":[]},{"cat":"items","sub":"magic","ico":"potion","kicker":"Магический предмет · Необычный","title":"Зелье лечения","body":"Восстанавливает 2d4+2 хитов, когда персонаж выпивает его действием. Самый нужный предмет любой партии.","id":"srd-zele-lecheniya","status":"official","srcbook":"DMG","src":"Руководство мастера (DMG) · перенос с ttg.club · адаптация КОМИК","dossier":[{"k":"Редкость","v":"Необычный"},{"k":"Особенности","v":"Расходуемый"},{"k":"Тип","v":"зелье"},{"k":"Стоимость (DMG)","v":"от 25 до 50 зм."}],"sections":[{"h":"Описание","t":"Вы восстанавливаете хиты, когда выпиваете это зелье. Количество восстанавливаемых хитов зависит от редкости зелья, как показано в таблице «зелья лечения». Вне зависимости от силы зелья оно представляет собой красную жидкость, сверкающую при встряхивании.\n\nЗелья лечения\nЗелье… — Редкость — Восстанавливает хитов\nлечения — Обычное — 2к4 + 2\nбольшого лечения [potion of greater healing] — Необычное — 4к4 + 4\nотличного лечения [potion of superior healing] — Редкое — 8к4 + 8\nпревосходного лечения [potion of supreme healing] — Очень редкое — 10к4 + 20"}]},{"cat":"character","sub":"feats","ico":"feat","kicker":"Черта","title":"Бдительный","body":"+5 к инициативе, вас нельзя застать врасплох, невидимые враги не получают преимущества.","id":"srd-bditelnyy","status":"official","srcbook":"PHB","src":"Книга игрока (PHB) · перенос с ttg.club · адаптация КОМИК","dossier":[{"k":"Требование","v":"Нет"}],"sections":[{"h":"Описание","t":"Вы всегда готовы к опасностям и получаете следующие преимущества:\n• Вы получаете бонус +5 к проверкам инициативы.\n\n• Вас не могут застать врасплох, пока вы в сознании.\n\n• Другие существа не получают преимущество для бросков атаки по вам за то, что вы их не видите."}]},{"cat":"character","sub":"feats","ico":"feat","kicker":"Черта","title":"Мастер большого оружия","body":"При крите или добивании — бонусная атака. Можно бить с −5 к атаке ради +10 к урону.","id":"srd-master-bolshogo-oruzhiya","status":"official","srcbook":"PHB","src":"Книга игрока (PHB) · перенос с ttg.club · адаптация КОМИК","dossier":[{"k":"Требование","v":"Нет"}],"sections":[{"h":"Описание","t":"Вы научились использовать вес своего оружия, позволяя инерции усиливать ваши атаки. Вы получаете следующие преимущества:\n• В свой ход, когда вы совершаете критическое попадание рукопашным оружием или опускаете им хиты существа до 0, вы можете бонусным действием совершить одну атаку рукопашным оружием.\n\n• Перед совершением рукопашной атаки оружием со свойством Тяжёлое, которым вы владеете, вы можете принять штраф −5 к броску атаки. Если такая атака попадает, вы добавляете +10 к урону от этой атаки."}]},{"cat":"paths","sub":null,"ico":"deity","kicker":"","title":"Отречение","body":"”Глупцы бегут от всех богов,\nСоздали царство вечных снов.\nИх волею пропитан тот,\nКто дарит им покой.”","id":"cms1ml2mr","status":"official","srcbook":"HB","src":"Редакция КОМИК","dossier":[{"k":"Божество","v":"Отсутствует"},{"k":"Эманатор","v":"Хранитель"}],"sections":[{"h":"Идущий по Пути","t":"Отреченные не признают дары богов, а после событий Раскола так и вовсе воспитали в себе ненависть к континентальным традициям и верованиям. Последователи Отречения получают преимущество при проверке характеристик, если их оппонентом является последователь иного Пути."}]},{"cat":"paths","sub":null,"ico":"rest","kicker":"","title":"Изобилие","body":"Жизнь стремится расти, исцелять и продолжаться вопреки любым невзгодам. Идущие этим Путём оберегают всё живое, даруют надежду и силу тем, кто готов принять их заботу, ведь истинное богатство мира заключается в самой жизни. Отречение извратило понятие данного Пути, применив новейшее оружие при Расколе, обратив последователей Изобилия в бессмертных, хищных исчадий.","id":"cms1mawe4","status":"official","srcbook":"HB","src":"Редакция КОМИК","dossier":[{"k":"Божество","v":"Изобилие"},{"k":"Эманатор","v":"Нет данных"}],"sections":[{"h":"Идущий по Пути","t":"Последователи данного Пути получают +2 к проверкам Медицины и Акробатики"}]},{"cat":"paths","sub":null,"ico":"rest","kicker":"","title":"Освоение","body":"Божество Освоения никогда не создавало Эманаторов среди смертных, но всегда шло бок о бок со своими последователями. Их корабли первыми отправлялись к новым землям, а главной целью бога-первопроходца была небесная дуга, что так манила астрономов и исследователей. Но вместо обещанного путешествия к звёздам случился Раскол, унесший жизнь божества, которое всегда стремилось к неизведанному за пределами небес.","id":"cms1m174w","status":"official","srcbook":"HB","src":"Редакция КОМИК","dossier":[{"k":"Божество","v":"Освоение"},{"k":"Эманатор","v":"Нет данных"}],"sections":[{"h":"Идущий по Пути","t":"Последователи данного Пути получают +2 к проверкам Атлетики и Восприятия"}]},{"cat":"world","sub":"deities","ico":"deity","kicker":"Божество · Путь Изобилие","title":"Изобилие","body":"Жизнь стремится расти, исцелять и продолжаться вопреки любым невзгодам.","id":"lg-deity-izobilie","status":"official","srcbook":null,"src":"Сеттинг LEGACY · КОМИК","dossier":[{"k":"Путь","v":"Изобилие"},{"k":"Эманатор","v":"Нет данных"},{"k":"Дар идущим","v":"+2 к проверкам Медицины и Акробатики"}],"sections":[{"h":"Описание","t":"Идущие этим Путём оберегают всё живое, даруют надежду и силу тем, кто готов принять их заботу, ведь истинное богатство мира заключается в самой жизни. Отречение извратило понятие данного Пути, применив новейшее оружие при Расколе, обратив последователей Изобилия в бессмертных, хищных исчадий."},{"h":"Идущий по Пути","t":"Последователи данного Пути получают +2 к проверкам Медицины и Акробатики"}]},{"cat":"world","sub":"deities","ico":"deity","kicker":"Божество · Путь Освоение","title":"Освоение","body":"Божество Освоения никогда не создавало Эманаторов среди смертных, но всегда шло бок о бок со своими последователями.","id":"lg-deity-osvoenie","status":"official","srcbook":null,"src":"Сеттинг LEGACY · КОМИК","dossier":[{"k":"Путь","v":"Освоение"},{"k":"Эманатор","v":"Нет данных"},{"k":"Дар идущим","v":"+2 к проверкам Атлетики и Восприятия"}],"sections":[{"h":"Описание","t":"Их корабли первыми отправлялись к новым землям, а главной целью бога-первопроходца была небесная дуга, что так манила астрономов и исследователей. Но вместо обещанного путешествия к звёздам случился Раскол, унесший жизнь божества, которое всегда стремилось к неизведанному за пределами небес."},{"h":"Идущий по Пути","t":"Последователи данного Пути получают +2 к проверкам Атлетики и Восприятия"}]}];

/* ═══════════════════════════════════════════════════════════════
   ШТОРКА. Ключевая механика прототипа.
   Полотно едет вправо и слегка уменьшается, шторка идёт следом с
   параллаксом. Жест ведётся пальцем один-в-один, отпускание решается
   не только положением, но и скоростью — как в мобильном Claude.
   ═══════════════════════════════════════════════════════════════ */
const shell=document.getElementById('shell'), pane=document.getElementById('pane'),
      drawer=document.getElementById('drawer'), scrim=document.getElementById('scrim'),
      burger=document.getElementById('burger'), edge=document.getElementById('edge');
let W=0, prog=0, dragging=false, sx=0, sy=0, sp=0, lastX=0, lastT=0, vel=0, axis='';

const measure=()=>{ W=drawer.getBoundingClientRect().width||300; };
measure(); addEventListener('resize',measure);

function paint(p){
  prog=Math.max(0,Math.min(1,p));
  const s=1-0.085*prog, r=22*prog;
  pane.style.transform=`translate3d(${W*prog}px,0,0) scale(${s})`;
  pane.style.borderRadius=r+'px';
  drawer.style.transform=`translate3d(${-W*0.32*(1-prog)}px,0,0)`;
  drawer.style.opacity=(0.35+0.65*prog).toFixed(3);
  scrim.style.opacity=(prog*0.9).toFixed(3);
  scrim.style.pointerEvents=prog>0.02?'auto':'none';
  burger.setAttribute('aria-expanded', prog>0.5?'true':'false');
}
function animateTo(p){ shell.classList.add('anim'); paint(p);
  clearTimeout(animateTo._t); animateTo._t=setTimeout(()=>shell.classList.remove('anim'),440); }
const openDrawer =()=>animateTo(1);
const closeDrawer=()=>animateTo(0);
burger.onclick=()=>prog>0.5?closeDrawer():openDrawer();
scrim.onclick=closeDrawer;
addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(sheetOpen) closeSheet(); else if(prog>0.5) closeDrawer(); } });

function down(e){
  const t=e.touches?e.touches[0]:e;
  // тянуть можно от левого края, либо в любом месте когда шторка открыта
  if(prog<0.5 && t.clientX>28 && e.currentTarget===edge) return;
  dragging=true; axis=''; sx=lastX=t.clientX; sy=t.clientY; sp=prog;
  lastT=performance.now(); vel=0; shell.classList.remove('anim');
}
function move(e){
  if(!dragging) return;
  const t=e.touches?e.touches[0]:e, dx=t.clientX-sx, dy=t.clientY-sy;
  if(!axis){ axis=Math.abs(dx)>Math.abs(dy)?'x':'y'; if(axis==='y'){dragging=false;return;} }
  if(e.cancelable) e.preventDefault();
  const now=performance.now(), dt=now-lastT;
  if(dt>0){ vel=(t.clientX-lastX)/dt; lastX=t.clientX; lastT=now; }
  paint(sp+dx/W);
}
function up(){
  if(!dragging) return; dragging=false;
  // скорость важнее положения: быстрый флик закрывает даже наполовину открытую шторку
  if(Math.abs(vel)>0.45) animateTo(vel>0?1:0);
  else animateTo(prog>0.45?1:0);
}
[edge,pane].forEach(el=>{
  el.addEventListener('touchstart',down,{passive:true});
  el.addEventListener('touchmove',move,{passive:false});
  el.addEventListener('touchend',up);
  el.addEventListener('mousedown',e=>{ if(prog>0.5||e.clientX<28) down(e); });
});
addEventListener('mousemove',move); addEventListener('mouseup',up);
paint(0);

/* ═══ Сеттинги и разделы ═══ */
const WORLDS=[
  {id:'classic',t:'Классика',c:'#d3a84a'},{id:'assimilation',t:'Assimilation',c:'#ff4757'},
  {id:'legacy',t:'Legacy',c:'#a78bfa'},{id:'neverland',t:'Neverland',c:'#ffd970'},
  {id:'terra',t:'Terra Aeterna',c:'#e8dcbf'}];
const VIEWS=[
  {id:'news',t:'Новости',i:'M4 5h16v14H4z M8 9h8M8 13h5'},
  {id:'combat',t:'Доска ходов',i:'M12 3l8 4.5v9L12 21l-8-4.5v-9z'},
  {id:'players',t:'Игроки',i:'M12 11a4 4 0 100-8 4 4 0 000 8z M4 21v-1a6 6 0 016-6h4a6 6 0 016 6v1'},
  {id:'world',t:'Архив',i:'M12 3a9 9 0 100 18 9 9 0 000-18z M3 12h18 M12 3c3 4 3 14 0 18 M12 3c-3 4-3 14 0 18'},
  {id:'settings',t:'Настройки',i:'M12 15a3 3 0 100-6 3 3 0 000 6z M19 12l2-1-2-4-2 .7a7 7 0 00-2-1.2L14.5 4h-5L9 6.5a7 7 0 00-2 1.2L5 7 3 11l2 1-2 1 2 4 2-.7a7 7 0 002 1.2L9.5 20h5l.5-2.5a7 7 0 002-1.2l2 .7 2-4z'}];
let CUR='classic', VIEW='news';

document.getElementById('worlds').innerHTML=WORLDS.map(w=>
  `<button class="dr-item" data-w="${w.id}" onclick="setWorld('${w.id}')">
     <span class="dot" style="background:${w.c};color:${w.c}"></span>${w.t}</button>`).join('');
document.getElementById('navs').innerHTML=VIEWS.map(v=>
  `<button class="dr-item" data-v="${v.id}" onclick="go('${v.id}')">
     <svg viewBox="0 0 24 24"><path d="${v.i}"/></svg>${v.t}</button>`).join('');

function setWorld(id){
  CUR=id; document.documentElement.dataset.project=id;
  const w=WORLDS.find(x=>x.id===id);
  document.getElementById('wName').textContent=w.t;
  document.querySelector('meta[name=theme-color]').content=
    getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  document.querySelectorAll('[data-w]').forEach(b=>b.classList.toggle('on',b.dataset.w===id));
  render(); closeDrawer();
}
function go(v){
  VIEW=v; document.getElementById('vName').textContent=(VIEWS.find(x=>x.id===v)||{}).t||'';
  document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  render(); closeDrawer();
}

/* ═══ Данные и отрисовка ═══ */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ICO={bestiary:'🐉',classes:'⚔️',lvl0:'✨',lvl1:'✨',lvl3:'✨',races:'🧝',magic:'🧪',feats:'🎯',deities:'☀️',paths:'🜁'};
// ASSIMILATION живёт без ядра SRD — как и на сайте
const forWorld=()=>CUR==='assimilation'?[]:DATA.filter(c=>!(c.cat==='paths'||c.sub==='deities')||CUR==='legacy');
const CATS=[{id:'character',t:'Персонаж',e:'🧝'},{id:'spells',t:'Заклинания',e:'✨'},
  {id:'items',t:'Снаряжение',e:'🎒'},{id:'world',t:'Мир',e:'🌍'},{id:'paths',t:'Пути',e:'🜁'}];

function cardHtml(c){
  return `<button class="cd" onclick="openSheet('${c.id}')">
    <span class="ic">${ICO[c.sub]||'📜'}</span>
    <span style="min-width:0">
      <span class="kk">${esc(c.kicker||c.cat)}</span>
      <div class="tt">${esc(c.title)}</div>
      <div class="bb">${esc(c.body||'')}</div>
    </span></button>`;
}
function render(){
  const v=document.getElementById('views');
  const list=forWorld();
  if(VIEW==='news'){
    v.innerHTML=`<div class="view on">
      <h2 class="vh">${CUR==='classic'?'Затерянные королевства':'Хроника мира'}</h2>
      <p class="hint">Приветствие сеттинга, лента новостей и запись на игру — как на сайте.</p>
      <div class="cards">
        <button class="cd"><span class="ic">📰</span><span><span class="kk">24 июля</span>
          <div class="tt">Добро пожаловать в мир классических приключений</div>
          <div class="bb">Здесь начинается история, которая будет написана вами.</div></span></button>
      </div>
      <div class="row2"><span class="pill">🎲 Ближайшая игра — суббота</span><span class="pill">3 / 5 мест</span></div></div>`;
  } else if(VIEW==='world'){
    const q=(document.getElementById('q').value||'').toLowerCase().trim();
    const found=q?list.filter(c=>c.title.toLowerCase().includes(q)):null;
    v.innerHTML=`<div class="view on">
      <h2 class="vh">Архив</h2>
      ${found?`<p class="hint">Найдено: ${found.length}</p><div class="cards">${found.map(cardHtml).join('')}</div>`
        :`<div class="cats">${CATS.map(c=>`<button class="cat"><span class="e">${c.e}</span><span class="n">${c.t}</span></button>`).join('')}</div>
          <h2 class="vh" style="font-size:1.05rem;margin-top:6px">Недавнее</h2>
          <div class="cards">${list.slice(0,8).map(cardHtml).join('')}</div>`}
      ${list.length?'':'<p class="hint">В ASSIMILATION свой архив без ядра SRD.</p>'}</div>`;
  } else if(VIEW==='players'){
    v.innerHTML=`<div class="view on"><h2 class="vh">Игроки</h2>
      <div class="cards">
        <button class="cd"><span class="ic">🛡️</span><span><span class="kk">Изобретатель 5</span>
          <div class="tt">Тэссаль Вольный</div><div class="bb">ХП 38 · КД 16 · Инициатива +2</div></span></button>
        <button class="cd"><span class="ic">🗡️</span><span><span class="kk">Плут 3</span>
          <div class="tt">Мойра</div><div class="bb">ХП 21 · КД 14 · Инициатива +4</div></span></button>
      </div>
      <p class="hint">Лист персонажа, калькулятор и книга заклинаний открываются тем же листом снизу.</p></div>`;
  } else if(VIEW==='combat'){
    v.innerHTML=`<div class="view on"><h2 class="vh">Доска ходов</h2>
      <div class="empty">
        <svg viewBox="0 0 100 100"><path d="M50 8l36 21v42L50 92 14 71V29z"/><path d="M50 20l26 15v30L50 80 24 65V35z"/><circle cx="50" cy="50" r="9"/></svg>
        <div class="t">Мастер не ведёт игру</div></div></div>`;
  } else {
    v.innerHTML=`<div class="view on"><h2 class="vh">Настройки</h2>
      <div class="cards">
        <button class="cd"><span class="ic">🎲</span><span><div class="tt">Режим Game Master</div>
          <div class="bb">Доска ходов, архив, новости</div></span></button>
        <button class="cd"><span class="ic">🔔</span><span><div class="tt">Уведомления</div>
          <div class="bb">Анонсы новых игр</div></span></button>
        <button class="cd"><span class="ic">💾</span><span><div class="tt">Резервная копия</div>
          <div class="bb">Только Мастер</div></span></button>
      </div></div>`;
  }
}
document.getElementById('q').addEventListener('input',()=>{ if(VIEW!=='world') go('world'); else render(); });

/* ═══ Нижний лист карточки: тянется вниз пальцем ═══ */
const sheet=document.getElementById('sheet'), sScrim=document.getElementById('sheetScrim');
let sheetOpen=false, sdY=0, sDrag=false, sVel=0, sLastY=0, sLastT=0;
function paintSheet(y){ sheet.style.transform=`translateY(${y}px)`;
  const h=sheet.getBoundingClientRect().height||1;
  sScrim.style.opacity=(1-y/h).toFixed(3); }
function openSheet(id){
  const c=DATA.find(x=>x.id===id); if(!c) return;
  document.getElementById('shHead').innerHTML=
    `<div class="kk" style="font-family:var(--f-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--red)">${esc(c.kicker||'')}</div>
     <h2 style="margin:0;font-family:var(--f-disp);font-size:1.42rem;font-weight:700">${esc(c.title)}</h2>`;
  document.getElementById('shBody').innerHTML=
    (c.body?`<p style="margin:0;color:var(--dim)">${esc(c.body)}</p>`:'')+
    (c.dossier&&c.dossier.length?`<div class="dos">${c.dossier.map(d=>
      `<div class="r"><div class="k">${esc(d.k)}</div><div class="v">${esc(d.v)}</div></div>`).join('')}</div>`:'')+
    (c.table?`<div class="tbl"><table><thead><tr>${c.table.cols.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
      <tbody>${c.table.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'')+
    (c.archs?`<div class="row2">${c.archs.map(a=>`<span class="pill">${esc(a.name)}</span>`).join('')}</div>`:'')+
    (c.sections||[]).map(s=>`<div class="sec"><h4>${esc(s.h)}</h4><p>${esc(s.t)}</p></div>`).join('')+
    `<div class="tags"><span class="tag canon">канон</span><span class="tag">${esc(c.srcbook||'SRD')}</span></div>`;
  sheetOpen=true; sScrim.style.pointerEvents='auto';
  shell.classList.add('anim'); requestAnimationFrame(()=>paintSheet(0));
  setTimeout(()=>shell.classList.remove('anim'),440);
}
function closeSheet(){
  sheetOpen=false; sScrim.style.pointerEvents='none';
  shell.classList.add('anim'); paintSheet(sheet.getBoundingClientRect().height||800);
  setTimeout(()=>shell.classList.remove('anim'),440);
}
sScrim.onclick=closeSheet;
const grab=document.getElementById('grab');
grab.addEventListener('touchstart',e=>{ sDrag=true; sdY=e.touches[0].clientY; sLastY=sdY;
  sLastT=performance.now(); sVel=0; shell.classList.remove('anim'); },{passive:true});
grab.addEventListener('touchmove',e=>{ if(!sDrag) return;
  const y=e.touches[0].clientY, d=Math.max(0,y-sdY);
  const now=performance.now(); if(now>sLastT){ sVel=(y-sLastY)/(now-sLastT); sLastY=y; sLastT=now; }
  paintSheet(d); if(e.cancelable) e.preventDefault(); },{passive:false});
grab.addEventListener('touchend',()=>{ if(!sDrag) return; sDrag=false;
  const h=sheet.getBoundingClientRect().height||800;
  const cur=parseFloat((sheet.style.transform.match(/translateY\(([-\d.]+)px\)/)||[0,0])[1]);
  (sVel>0.5||cur>h*0.32)?closeSheet():(shell.classList.add('anim'),paintSheet(0),
    setTimeout(()=>shell.classList.remove('anim'),440)); });
paintSheet(2000);

setWorld('classic'); go('news');
</script>
</body></html>
